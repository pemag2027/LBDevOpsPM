name: Docker Build and Test


on:

  push:

    branches: [ main, master ]

  pull_request:

    branches: [ main, master ]


env:

  IMAGE_NAME: python-nasobeni


jobs:

  build-and-test:

    runs-on: ubuntu-latest

    

    steps:

    - name: Checkout repository

      uses: actions/checkout@v4

    

    - name: Set up Python

      uses: actions/setup-python@v4

      with:

        python-version: '3.9'

    

    - name: Run unit tests

      run: |

        echo "🧪 Spouštění unit testů..."

        python -m unittest "Lekce5/app/test_multiply.py" -v

    

    - name: Set up Docker Buildx

      uses: docker/setup-buildx-action@v3

    

    - name: Build Docker image

      run: |

        echo "🐳 Buildování Docker image..."

        pwd

        docker build -f "Lekce5/Dockerfile" -t calculator:latest .

        

    

    - name: Test Docker container

      run: |

        echo "🚀 Testování Docker kontejneru..."

        docker run --rm calculator:latest

    

    - name: List Docker images

      run: |

        echo "📋 Seznam vytvořených images:"

        docker images | grep calculator